[project]
name = "tcc-api-versioning-experiment"
version = "1.0.0"
description = "Experimento controlado sobre versionamento de APIs REST"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx2==2.13.1",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
